# ── harness 清单（v11 吸收原 agent.yaml；该文件已删除）──────────
# skills/agents 启用清单不再双写：以 loading_tiers + skills-INDEX/agents-INDEX 为准。
# 五阶段 phase→command→gate 以 CLAUDE.md「五阶段流程」为准。
harness:
  name: claude-code-primary
  hooks:
    profile_env: CLAUDE_HOOK_PROFILE
    default: standard
    core:
      - session-start-bootstrap
      - pre-graph-freshness
      - pre-explore-router
      - pre-userprompt-issue-tracker
      - pre-userprompt-verify-gate
      - pre-bash-guard
      - pre-rtk-rewrite
      - pre-read-before-edit
      - pre-context-injector
      - pre-manifest-validator
      - pre-edit-impact-nudge
      - pre-encoding-snapshot
      - post-secret-detector
      - post-edit-format
      - post-encoding-check
      - post-edit-verify-tracker
      - pre-compact-state
      - stop-verification-gate
      - stop-session-summary
      - stop-readme-updater
    unregistered:
      - stop-graph-freshness
    disabled:
      - pre-task-planner
  commands:
    workflow: [discuss, plan, execute, verify, ship, review, clear, status]
    openspec: [propose, apply, archive, sync]
  mcp_loading:
    always: [codegraph, code-review-graph, serena, grep]
    debug: [chrome-devtools]
    fsaccess: [fs]
    ops: [redis, sqlite, docker, postgres]
    profile_env: CLAUDE_MCP_PROFILE

# ── v12 sync 声明（多编辑器 1+N）──────────────────────────
sync_targets:
  # v11.1：Claude Code 原生读 ~/.claude（无需同步）；编辑器侧恢复多目标（用户 2026-08-13 决策）。
  # 清单 SSOT = config/sync-manifest.json editors 段（home 缺席自动跳过），本行仅声明镜像；
  # v12 四端：cursor / qoder-cn / trae-cn / trae；qoder/codearts/workbuddy 已移除。
  editors: [cursor, qoder-cn, trae-cn, trae] # v12：死编辑器已移除；Codex/OpenCode 解耦不投放 AGENTS.md
  method: symlink_first_copy_fallback
  script: scripts/sync.ps1
  modes: [default, -Skills, -All, -DryRun]
  # v11：ROUTER 并入 CLAUDE.md、agent.yaml 并入本文件 harness 节，根文件 8→6；
  # 常量单源 = config/sync-manifest.json（sync.ps1 / check.ps1 / impact_sync.py 共同消费），
  # 本节 root_index_files 仅为声明镜像，改集合以 sync-manifest.json 为准。
  root_index_files:
    [
      CLAUDE.md,
      SPEC.md,
      MANIFEST.yaml,
      skills-INDEX.md,
      agents-INDEX.md,
      rules-INDEX.md,
    ]
  rules_ext:
    cursor: ".mdc" # 经 local plugin claude-config（唯一规则通道）
  root_filename:
    default: "CLAUDE.md"
