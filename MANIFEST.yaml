# 组件唯一归属源 — 防左右手互博 — v12.0.1
# 权威: SPEC.md | 五柱×五阶段×三横切 | 调研摘要 docs/research/COVERAGE.md

# 防互博原则: 新 skill/agent 加入时必须声明 excludes 关系。无 excludes = 视为无冲突，事后发现互博 → 追溯补齐。

version: "12.0.1"
updated: "2026-09-02"

# ── v10 架构决策（访谈确认）────────────────────────────────────
ecc_integration: cherry_pick # 吸收 ECC 2.0 模式，不安装 ECC 插件

superpowers:
  source: obra/superpowers
  version: "6.3.0" # v11.4: claude plugin update 已升运行态（installed_plugins.json 事实源）；override 机制不变
  override: local_post_load # 插件自动更新 + 本地 skills 后加载覆盖

openspec_config:
  source: Fission-AI/OpenSpec
  version: "1.4.1"
  profile: core # v1.4.1: sync 已并入 core；verify/bulk-archive 见 openspec init + 本地 rules
  cli_required: true

thresholds:
  cursor: [70, 90]
  claude_code: [70, 90]
  gsd_logical_breakpoint: 70 # 任务边界/子Agent切换，非强制压缩

codegraph:
  policy: mandate_init
  scope: global_only # ~/.claude 全局索引；业务项目按需 init
  note: "探索前须 codegraph init；validate_config V16 校验"

module_resolver:
  description: "ECC 2.0 cherry-pick — 声明不可共存模块"
  conflicts:
    - [deer_flow, workstream_management]
    - [shell_token, output_token]
    - [change_spec, phase_planning]
    - [plugin/compound-engineering, gstack_review]
    - [task_master_mcp, writing-plans]
    - [autoplan, brainstorming_design]
    - [triage, systematic_debugging]
    - [design_pipeline, brainstorming_ui]
    - [claude-mem:make-plan, writing-plans]
    - [claude-mem:do, executing-plans]
    - [claude-mem:smart-explore, codegraph_explore]
    - [feature-dev:code-architect, architect]
    - [feature-dev:code-explorer, code-explorer]
    - [feature-dev:code-reviewer, code-reviewer]
    - [deep_research, firecrawl_agent]
    - [land_and_deploy, release_engineer] # v11: release-engineer 已并入 skill/ship；互斥仅防历史回潮
    - [agentic_orchestrator, pair_agent] # 已删 pair-agent，仅防回潮
    - [codebase_memory:search_graph, codegraph_explore]
    - [codebase_memory:semantic_query, claude_context_mcp]
  hook_profile:
    env: CLAUDE_HOOK_PROFILE
    values: [minimal, standard, strict]
    default: standard
    note: "映射本地 hook 子集，非 ECC 插件脚本"

pillars:
  superpowers: {
      source: obra/superpowers,
      version: "6.3.0", # 与顶栏 superpowers.version / 插件运行态对齐（v11.4）
      capabilities: [brainstorming, verification, debugging],
    }
  gsd:
    {
      source: open-gsd/gsd-core,
      version: "1.11.0",
      note: "概念集成未装 npm 包（Node≥24 约束不适用）；honest-verifier 三态处置记为后续候选；调研 docs/research/45",
      capabilities:
        [context-engineering, continuous-execution, read-before-edit],
    }
  openspec:
    {
      source: Fission-AI/OpenSpec,
      version: "1.4.1",
      capabilities: [proposal-spec-tasks, spec-validation],
    }
  gstack: {
      source: garrytan/gstack,
      version: "0.19",
      # v12: land-and-deploy/design-shotgun 在 agents/（低频 disable-model-invocation）；ios-specialist/pair-agent 防回潮 excludes；
      # cso 全量审计并入 security-review（security-reviewer 深度模式）；taste-learning 走 skill/taste-memory
      capabilities:
        [
          eng-review,
          ceo-review,
          design-review,
          qa-review,
          security-review,
          ios-specialist,
          codex-review,
          ml-defense,
          taste-learning,
          pair-agent,
          land-and-deploy,
          design-shotgun,
        ],
    }
  claude_mem: {
      source: thedotmack/claude-mem,
      version: "13.23.1", # 跟随上游，取消 13.13.1 钉扎
      capabilities: [cross-session-memory, pattern-extraction],
    }

horizontal_layers:
  L1_governance:
    description: 治理横切层 — 防互博 + hook分级 + 编排
    owners:
      - source: affaan-m/ECC
        version: "2.1.0"
        concerns:
          [manifest-validation, hook-profile, loop-guard, selective-install]
      - source: bytedance/deer-flow
        version: "2.0"
        concerns:
          [LangGraph-orchestration, flash-standard-pro-ultra, claude-bridge]
  L2_optimization:
    description: 优化横切层 — Token压缩 + 上下文治理
    owners:
      - source: rtk-ai/rtk
        version: "0.45.0"
        concerns: [shell-compression, 60-90pct-savings]
      - source: JuliusBrussee/caveman
        version: "1.9.1"
        concerns: [output-compression, lite-full-ultra-wenyan] # v11.4 豁免：上游 2.x 同名技能已重定位为「文件压缩器」，套用即破坏输出压缩语义；保持本地正文，待专项评估 plugins/caveman
      - source: internal
        concerns: [context-threshold-70-90, gsd-logical-breakpoint-70]
  L3_insight:
    description: 洞察横切层 — 代码图谱 + 外部搜索（UA removed v10.5）
    owners:
      - source: colbymchenry/codegraph
        version: "1.5.0" # v10.11: MCP daemon 实测；CLI 0.9.7 待对齐（可选 V1）；原记 1.0.1
        concerns:
          [pre-indexed-knowledge-graph, daemon-watchdog, config-redaction]
      - source: DeusData/codebase-memory-mcp
        version: "0.8.1"
        concerns: [] # 历史 concern（架构导览/语义检索等）已由 codegraph 全权承接
        loading: disabled # v10.10 永久禁用（全盘索引爆 CPU/内存）；v11 复评维持禁用（上游 0.9 重写但与 codegraph 重叠）
      - source: Firecrawl/Exa
        concerns: [web-scraping, external-search]

loading_tiers:
  L0: [CLAUDE.md, rules/CORE.md] # v11: CLAUDE-ROUTER 已并入 CLAUDE.md
  L1:
    [
      skill/using-superpowers,
      skill/task-triage,
      skill/change-impact-analysis,
      skill/brainstorming,
    ]
  L2_gate:
    spec: [skill/writing-plans, skill/spec-validation]
    execute: [skill/executing-plans] # v10.15: subagent-driven-development 默认关闭（用户显式要求时触发）
    verify: [skill/verification-before-completion]
    debug: [skill/systematic-debugging]
  L3_signal:
    - skill/deep-research
    - skill/adr-management
    - skill/workstream-management
    - skill/git-workflow
    - skill/pr-workflow
    - skill/claude-mem-maintenance
  L3_dispatch: [agents/*, mcp/*, skills/* description 触发] # v12：主题规则已转 skill；rules 仅 CORE+FRONTEND
  note: "Cursor: L2/L3 用 disable-model-invocation + 显式 Read；Claude Code: layer + using-superpowers 路由"

phases:
  plan:
    { stage: ①规划, command: /discuss, pillar: superpowers, gate: HARD-GATE }
  spec:
    { stage: ②规格, command: /plan, pillar: openspec, gate: spec-validation }
  execute: { stage: ③执行, command: /execute, pillar: gsd, gate: build-pass }
  verify: { stage: ④验证, command: /verify, pillar: gstack, gate: quality-gate }
  learn:
    {
      stage: ⑤学习,
      command: /compact,
      pillar: claude_mem,
      gate: pattern-extracted,
    }

concerns:
  brainstorming:
    owner: skill/brainstorming
    source: obra/superpowers
    stage: plan
    excludes: [agent/planner]

  planning:
    owner: skill/writing-plans
    delegates: [agent/planner]
    command: plan
    source: obra/superpowers
    stage: spec
    # pre-task-planner 已移除（见本文件 harness.hooks.disabled），保留于 excludes 防重新引入
    excludes: [agent/agentic-orchestrator, hook/pre-task-planner]
    depends_on: [skill/brainstorming]

  project_context:
    owner: hook/pre-context-injector
    note: 每会话缓存一次，注项目CLAUDE.md
    excludes: [hook/session-start-bootstrap]

  multi_agent:
    owner: agent/agentic-orchestrator
    skill: skill/subagent-driven-development
    source: affaan-m/ECC
    stage: execute
    note: v10.15 默认关闭；仅用户显式要求子Agent派发时启用
    excludes: [agent/planner]

  execution:
    owner: skill/executing-plans
    source: obra/superpowers
    stage: execute
    note: 仅 NON_SIMPLE 路径；简单任务(task-triage判定=关联需改≤2)旁路 executing-plans/subagent-driven（v10.15 默认关闭）
    depends_on: [skill/writing-plans]
    optional_skills: [skill/subagent-driven-development] # v10.15: 用户显式要求时启用

  verification:
    owner: skill/verification-before-completion
    hook:
      [
        pre-userprompt-verify-gate,
        post-edit-verify-tracker,
        stop-verification-gate,
        first-edit-verify,
        verification-stop,
      ]
    source: obra/superpowers
    stage: verify
    note: "v11.4.12 — 一次找齐再集中改；每轮独立审查必须全新开审（禁止 resume）。v11.4.11 — 审查者只找问题，修改走 change-implementer；配置/文档/注释必须同步。v11.4.10 — Cursor 完成门不再 followup（规则驱动双审）；Claude Stop exit 2 保留。v11.4.9 — 有改动即双审；独立审查 PASS/符合预期即停，仅结论不一致（NEEDS-CHANGES）才再开一轮最多 3 轮；计划未批准零注入（CallDynamicTool/CreatePlan）。v11.4.8 — 双审=修改→验证→审查循环最多 3 轮（dual_pass_phase）。上游：Claude Stop exit 2。SSOT quality_gates.json + hooks/_lib/r20_replay.py。"

  debugging:
    owner: skill/systematic-debugging
    source: obra/superpowers
    stage: execute
    depends_on: [rules/CORE.md]

  change_impact:
    owner: skill/change-impact-analysis
    source: local
    stage: execute
    note: 改前 codegraph_impact + Grep 全项目；改后残留引用检测
    depends_on: [rules/CORE.md]

  tdd:
    owner: skill/test-driven-development
    source: obra/superpowers
    stage: execute

  code_review_request:
    owner: skill/requesting-code-review
    source: obra/superpowers
    stage: verify

  code_review_receive:
    owner: skill/receiving-code-review
    delegates: [agent/eng-reviewer]
    source: obra/superpowers
    stage: verify

  spec_review:
    owner: skill/spec-validation
    delegates: [agent/spec-reviewer]
    source: Fission-AI/OpenSpec
    stage: spec

  memory:
    owner: plugin/thedotmack
    skill: skill/memory-compression
    source: thedotmack/claude-mem
    stage: learn
    # context-manager 已合并进 claude-mem 并删除，保留于 excludes 防重新引入
    excludes: [agent/context-manager, tool/Read重复文件]
    depends_on: [skill/memory-compression]
    note: "v10.5.2: R18记忆优先 — 重复Read相同文件前必须先 claude-mem search"

  context_retrieval:
    owner: plugin/thedotmack
    skill: skill/memory-compression
    source: thedotmack/claude-mem
    note: 检索/持久化由 claude-mem 统一负责，原 agent/context-manager 已合并

  context_rot:
    owner: skill/memory-compression
    hook: pre-compact-state
    source: open-gsd/gsd-core
    stage: learn
    depends_on: [skill/context-policy, rules/CORE.md]

  shell_token:
    owner: hook/pre-rtk-rewrite
    source: rtk-ai/rtk
    stage: execute
    excludes: [skill/caveman-compress]

  output_token:
    owner: skill/caveman-compress
    source: JuliusBrussee/caveman
    excludes: [hook/pre-rtk-rewrite]

  change_spec:
    owner: openspec/changes/
    command: propose
    source: Fission-AI/OpenSpec
    stage: spec
    excludes: [planning/phases]
    depends_on: [skill/spec-validation]

  phase_planning:
    owner: planning/phases/
    source: open-gsd/gsd-core
    stage: spec
    excludes: [openspec/changes]

  lite_spec:
    owner: spec/<project>/ # 约定占位（spec/README.md），非实体路径
    source: local
    stage: spec

  ui_token:
    owner: rules/FRONTEND.md # v11: rules/DESIGN.md 并入 FRONTEND「设计系统」节
    skill: rules/FRONTEND.md
    source: VoltAgent/awesome-design-md
    stage: spec

  coding_philosophy:
    owner: skill/karpathy-guidelines
    rules_ref: rules/CORE.md # v11.2.0: CORE.md 新增工程原则节（第一性原理/YAGNI/依赖克制/删除过时优先）
    source: multica-ai/andrej-karpathy-skills # v10.11: forrestchang 组织迁移（同仓库双名）

  gsd_context:
    owner: skill/subagent-driven-development
    hooks: [pre-read-before-edit]
    rules_ref: skill/workflow
    source: open-gsd/gsd-core
    stage: execute
    depends_on: [skill/context-policy, skill/workflow]

  gstack_review:
    owner: skill/agent-collaboration
    catalog:
      [eng-reviewer, ceo-reviewer, designer, dx-reviewer, qa, security-reviewer]
    source: garrytan/gstack
    stage: verify
    delegates: [agent/eng-reviewer, agent/spec-reviewer]
    depends_on:
      [
        agents/eng-reviewer,
        agents/ceo-reviewer,
        agents/designer,
        agents/dx-reviewer,
        skill/agent-collaboration,
      ]

  workstreams:
    owner: skill/workstream-management
    source: open-gsd/gsd-core
    stage: execute
    depends_on: [skill/using-git-worktrees, plugin/thedotmack, skill/workflow]

  adr:
    owner: skill/adr-management
    source: open-gsd/gsd-core
    stage: plan
    path: docs/ADR/
    depends_on: [skill/brainstorming]

  onboarding:
    owner: skill/onboarding-guide # v12 已迁入 skills/（低频 disable-model-invocation）
    source: Fission-AI/OpenSpec
    stage: plan
    depends_on: [mcp/codegraph]

  openspec_rules:
    owner: skill/openspec-rules
    source: Fission-AI/OpenSpec
    stage: spec
    depends_on: [skill/spec-validation]

  gstack_dx:
    owner: agent/dx-reviewer
    source: garrytan/gstack
    layer: skeleton
    stage: verify
    triggered_by: [ui-changes, ux-changes, new-features, api-design]

  codegraph_explore:
    owner: mcp/codegraph
    source: colbymchenry/codegraph
    stage: execute
    note: "R17 — 代码探索首选，先于 Grep；v1.5 起 MCP server 自带 watcher 自动同步（300ms 静默窗 + connect-time catch-up），post-codegraph-sync hook 已于 v11 退役"

  context_monitor:
    owner: rules/CORE.md # 未注册 hook：stop-context-monitor 文件保留，由 Cursor Guard 阈值/原生机制覆盖（v10.10 对齐运行态）
    source: affaan-m/ECC
    depends_on: [hook/pre-suggest-compact, rules/CORE.md]

  cursor_guard:
    owner: templates/cursor-guard
    source: local
    stage: execute
    note: "Cursor Guard v1.2.11 — resume 审查 Task 不计入 reviews；每轮须全新开审。v1.2.10 — 完成门不再 followup；规则驱动双审。v1.2.9 起有改动即双审。v1.2 基线：sync/压缩/codegraph路由/shell/密钥/维护提示；~/.cursor 独立；低耦合 Claude"
    # post-sync-on-edit 已移除（Cursor 侧走 sync_on_edit.py）；post-codegraph-sync 已于 v11
    # 双侧退役（codegraph v1.5 MCP 自动同步），此处保留 excludes 防止未来重复挂载
    excludes: [hook/post-sync-on-edit, hook/post-codegraph-sync]
    depends_on: [scripts/sync.ps1]

  gate_enforcement:
    owner: hooks/_lib/gate_messages.md
    source: local
    stage: all
    note: "v10.15.0 — 三门控文本 SSOT：P0分类门 + 完成验证门（软注入+硬阻断）+ 变更影响门；双端 hook 注入，非模型自觉。v10.15：分类门新增 TDD/SDD 默认关闭、疑难禁直接改、重复问题去重；完成验证门新增残留引用+回归保持。硬门配置 config/quality_gates.json verification_gate 节"
    hooks:
      [
        session-start-bootstrap,
        pre-userprompt-verify-gate,
        post-edit-verify-tracker,
        stop-verification-gate,
        pre-edit-impact-nudge,
        verification_gate,
        verify_tracker,
        impact_nudge,
      ]
    depends_on:
      [
        skills/using-superpowers,
        skills/task-triage,
        skills/verification-before-completion,
        skills/change-impact-analysis,
        config/quality_gates.json,
        hooks/_lib/tool_paths.py,
        templates/cursor-guard,
      ]

  issue_tracker:
    owner: hooks/pre-userprompt-issue-tracker.py
    source: local
    stage: plan
    note: "v10.17.0 — 问题指纹追踪：同问题重复出现时注入「先查上轮结论禁止重做」；推翻 v10.13『不做 hook 计数器』决策（用户 2026-08-12 重新决策）。仅注入不阻断。v10.17 起指纹算法与状态双端共用 hooks/_lib/issue_state.py（单一状态 ~/.claude/.state/issue-tracker.json），stop-verification-gate 验证通过时置 resolved=true 激活轻提示分支；Cursor 端 templates/cursor-guard/hooks/issue_tracker.py（guard 1.2.0）"
    # 单一 depends_on：v10.17 一度写成两个同名键，YAML 后者覆盖前者，
    # issue_state.py / stop-verification-gate.py 等依赖会被静默丢弃
    depends_on:
      [
        hooks/_lib/issue_state.py,
        hooks/stop-verification-gate.py,
        templates/cursor-guard/hooks/issue_tracker.py,
        config/quality_gates.json,
        skills/task-triage,
        skills/verification-before-completion,
        hooks/_lib/gate_messages.md,
        templates/cursor-guard,
        plugin/thedotmack,
      ]

  code_review_graph:
    owner: mcp/code-review-graph
    source: tirth8205/code-review-graph
    stage: verify
    note: "v10.14 引入 — 审查/验证专用图谱：TESTED_BY 测试缺口、detect_changes 风险评分、review-delta、pre_merge_check。与 codegraph 互补（codegraph=R17 探索主位；CRG=审查/验证专用）。项目内 code-review-graph build 建图。v11.4 升钉 2.3.8（2.3.7 明示 no breaking；token 预算硬顶利好 detect_changes）"
    depends_on: [mcp/codegraph, skills/verification-before-completion]

  tmux_reminder:
    owner: hook/pre-tmux-reminder
    source: affaan-m/ECC
    note: ECC pre:bash:tmux-reminder — 长运行命令非tmux环境警告

  taste_memory:
    owner: skill/taste-memory # v12 已迁入 skills/
    source: garrytan/gstack
    stage: learn
    depends_on: [plugin/thedotmack]
    note: 通过 claude-mem observation 存设计偏好，不修改插件

  deer_flow_bridge:
    owner: skill/claude-to-deerflow # v12 已迁入 skills/
    source: bytedance/deer-flow
    stage: execute
    loading_tier: on_demand
    depends_on: [skill/workflow]
    excludes: [agent/planner, skill/workstream-management]

  deep_research:
    owner: skill/deep-research
    source: local
    stage: plan
    loading_tier: L3
    excludes:
      [
        firecrawl:firecrawl-agent,
        tool/WebFetch,
        tool/WebSearch,
        skill/deep-research,
      ]
    note: "deep-research = L3 结构化调研(Firecrawl+Exa+Context7)；firecrawl-agent = 非调研场景纯数据提取。场景互斥。权威实现：skills/deep-research/SKILL.md（slash 信号 /deep-research）。"

  git_workflow:
    owner: skill/git-workflow
    source: user-rules-migration
    stage: ship
    loading_tier: L3
    note: User Rules 迁出；显式 commit 时 Read

  pr_workflow:
    owner: skill/pr-workflow
    source: user-rules-migration
    stage: ship
    loading_tier: L3
    note: User Rules 迁出；显式开 PR 时 Read

  claude_mem_maintenance:
    owner: skill/claude-mem-maintenance
    source: user-rules-migration
    stage: learn
    loading_tier: L3
    depends_on: [plugin/thedotmack]

  cursor_plugin_boundary:
    owner: config/MANIFEST.yaml
    note: Cursor 禁用 compound-engineering 插件；审查仅 ~/.claude/agents/ gstack 路由
    excludes: [plugin/compound-engineering/*]

  mcp_tiering:
    owner: config/.mcp.json
    note: Claude 常驻 = 本地代码3（codegraph/CRG/serena）+ grep；context7/exa/playwright 走 Plugins；chrome-devtools plugin 默认 false；无 aider-repo-map/sequential-thinking；fs→mcp-configs/fsaccess.json 按需；cbm 永久禁用
    depends_on: [
        docs/CURSOR_MCP_PROFILE.md,
        docs/TOOL_MATCHING_GUIDE.md,
        skill/mcp-config,
        mcp/servers.json,
        mcp/README.md,
      ] # v11: agent.yaml 已并入本文件 harness.mcp_loading

  mcp_local_code_split:
    owner: skill/mcp-config
