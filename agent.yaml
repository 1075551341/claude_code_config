# ECC harness manifest — 全局启用组件清单 v10.17.0
# 权威: MANIFEST.yaml v10.17.0 | 五柱×五阶段×三横切

version: "10.17.0"
harness: claude-code-primary

phases:
  plan:
    { stage: ①规划, command: /discuss, pillar: superpowers, gate: HARD-GATE }
  spec:
    { stage: ②规格, command: /plan, pillar: openspec, gate: spec-validation }
  execute: { stage: ③执行, command: /execute, pillar: gsd, gate: build-pass }
  verify: { stage: ④验证, command: /verify, pillar: gstack, gate: quality-gate }
  learn:
    {
      stage: ⑤学习,
      command: /compact,
      pillar: claude_mem,
      gate: pattern-extracted,
    }

skills:
  p0:
    - using-superpowers
    - brainstorming
    - change-impact-analysis
    - verification-before-completion
    - systematic-debugging
    - task-triage # v10.11: 对齐 P0 路由集 6（原缺）
  workflow:
    source: obra/superpowers
    enabled:
      - writing-plans
      - executing-plans
      - test-driven-development # v10.15: 默认关闭，用户显式要求时触发
      - subagent-driven-development # v10.15: 默认关闭，用户显式要求时触发
      - using-git-worktrees
      - receiving-code-review
      - requesting-code-review
      - finishing-a-development-branch
      - writing-skills
  extension:
    source: gstack + GSD + ECC
    enabled:
      - autoplan
      - browser-qa
      - design-pipeline
      - ship
      - office-hours
      - context-engineering
      - structured-artifacts
      - instinct-learning
      - workstream-management
      - adr-management
      - onboarding-guide
  meta:
    enabled:
      - memory-compression
      - spec-validation
      - karpathy-guidelines
      - caveman-compress
  mattpocock:
    source: mattpocock/skills
    enabled:
      - triage
      - improve-codebase-architecture
  insight:
    enabled: []
    note: "architecture guidance uses codegraph (cbm 已禁用)"
  bridge:
    enabled:
      - claude-to-deerflow
      - taste-memory

agents:
  core:
    source: ECC + superpowers
    enabled:
      - planner
      - code-explorer
      - code-reviewer
      - build-error-resolver
      - architect
      - spec-reviewer
      - agentic-orchestrator
    note: context-manager 已合并至 claude-mem plugin
  gstack_review:
    source: garrytan/gstack
    enabled:
      - eng-reviewer
      - ceo-reviewer
      - designer
      - dx-reviewer
      - qa
      - security-reviewer
  gstack_supplement:
    source: garrytan/gstack
    version: "0.19"
    enabled:
      - cso
      - sre
      - release-engineer
      - product-manager
      - design-engineer
      - performance-engineer
      - doc-writer
  gstack_v019:
    source: garrytan/gstack
    version: "0.19"
    enabled:
      - codex-reviewer
      - ios-specialist
      - design-shotgun
      - pair-agent
      - land-and-deploy

hooks:
  profile_env: ECC_HOOK_PROFILE
  default: standard
  # settings.json 已注册（v10.17 对齐：三门控 + 补注册 issue-tracker）
  core:
    - session-start-bootstrap
    - pre-userprompt-issue-tracker
    - pre-userprompt-verify-gate
    - pre-bash-guard
    - pre-rtk-rewrite
    - pre-read-before-edit
    - pre-context-injector
    - pre-manifest-validator
    - pre-edit-impact-nudge
    - post-secret-detector
    - post-edit-format
    - post-codegraph-sync
    - post-edit-verify-tracker
    - pre-compact-state
    - stop-verification-gate
    - stop-session-summary
    - stop-readme-updater
    - stop-knowledge-graph-sync
  # 文件在 hooks/ 但未注册：Claude Code 原生机制或 Cursor Guard 已覆盖，保留备用
  _unregistered:
    - pre-tmux-reminder
    - pre-loop-guard
    - pre-suggest-compact
    - stop-context-monitor
  _optional:
    - pre-dep-checker
    - pre-git-hook-bypass-block
    - post-edit-lint
    - post-test-runner
    - post-doc-reminder
    - stop-notify
    - stop-debug-checker
    - stop-daily-summary

commands:
  workflow:
    - discuss
    - plan
    - execute
    - verify
    - ship
    - review
    - compact
    - clear
    - status
    - office-hours
    - autoplan
    - workstream
    - adr
    - deep-research
  openspec:
    - propose
    - apply
    - archive
    - sync # commands/sync.md（/opsx:sync delta 合并），此前漏登记

catalog:
  skills: catalog/skills/
  agents: catalog/agents/
  rules: catalog/rules/
  note: 按需复制到项目 .claude/，不全局加载

disabled_hooks:
  - pre-task-planner

mcp_loading:
  always: [codegraph, code-review-graph, aider-repo-map, serena, github, grep, exa, context7, firecrawl] # v10.17: .mcp.json 常驻 9 三层架构（本地代码4+远端探索2+Web&文档3）；pw 走插件勿双挂
  debug: [chrome-devtools] # v10.17 降级按需：mcp-configs/debug.json
  fsaccess: [fs] # v10.17 降级按需：mcp-configs/fsaccess.json（全盘可写会绕过验证追踪链）
  ops: [redis, sqlite, docker, postgres]
  profile_env: CLAUDE_MCP_PROFILE

limits:
  global_agents_max: 25
  global_skills_max: 45 # v10.11: 对齐实际 45（原 44 滞后）
  global_rules_max: 12
