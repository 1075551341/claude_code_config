# 工作流主干（Workflow Spine）— v13 唯一调度面：阶段 / 门控 / 完成定义 / 审查
#
# 本文件只描述「角色、阶段、门控、习惯」，不描述「用哪个模型」：
#   - 模型由调用方决定（会话 /model、settings.json、编辑器模型选择器、Task 调用方传参）。
#   - 推理强度（effort / thinking）只由实际被调用的模型及其自身设置决定。
#   - 本包任何文件不得写模型 ID / 厂商档位 / effort 档；`workflow.py check` 的 model-agnostic lint 强制。
#
#   python scripts/workflow.py render   # 把派生块写回 agents/commands/CLAUDE.md/quality_gates.json …
#   python scripts/workflow.py check    # 校验 + 漂移 + model-agnostic lint（validate_config V21 调用）
#   python scripts/workflow.py show     # 打印阶段 / 轨道 / 完成定义
#
# 派生目标见 docs/DEV_FLOW.md「派生清单」。禁止手改 <!-- spine:* --> 标记块内文本。

schema: 2
pack_version: "13.0.2"

# ── 1. 阶段（stage）与轨道（track）─────────────────────────────────
# role = session（主会话）或 agents/<name>.md；agent 不声明 model/effort，一律继承调用方。
# 每阶段 exit 是「一次通过」契约：exit 全部满足才进入下一阶段。
stages:
  triage:
    label: ⓪分类
    skill: task-triage
    role: session
    exit:
      - 输出分类契约：大类 | 需改文件 | verify_tier | 置信度 | 成功标准
  debug:
    label: ⓑ根因
    skill: systematic-debugging
    role: session
    entry: [Bug 类（多文件 / 根因不明 / 持续处理）]
    exit:
      - 根因证据一行（失败日志 / 断点 / 最小复现）
      - 修复点与回归验证命令写入影响清单
  research:
    label: ⓡ调研
    skill: deep-research
    role: session
    entry: [调研类（选型 / 竞品 / 深度调研）]
    exit:
      - 关键结论 ≥2 个独立来源交叉验证，标注时效与可信度
  discuss:
    label: ①规划
    command: discuss
    skill: brainstorming
    role: session
    entry: [非简单（triage 判定）]
    exit:
      - grill ≤5 问收敛，验收标准可量化
      - HARD-GATE：用户批准设计
  spec:
    label: ②规格
    command: plan
    skill: writing-plans
    role: planner
    entry: [设计已批准]
    exit:
      - spec-validation 通过，无静默缩 scope
      - 就绪定义（quality.definition_of_ready）全部满足
  execute:
    label: ③执行
    command: execute
    skill: executing-plans
    role: change-implementer
    entry: [就绪定义全部满足]
    exit:
      - 清单内文件一次改齐（含文档/注释/INDEX/版本戳）
      - 构建/类型/Lint 通过；R16 无静默吞异常
      - 交审前自检（quality.self_check）通过
  verify:
    label: ④验证
    command: verify
    skill: verification-before-completion
    role: session
    entry: [执行阶段 exit 满足]
    exit:
      - verify_tier 对应清单全部附命令证据
      - 审查前刷图（last_edit 之后）
      - 本轮全新独立审查全部 PASS（completion + review.routing）
  learn:
    label: ⑤学习
    command: compact
    skill: memory-compression
    role: session
    exit: [claude-mem 记录模式/决策（R18）]
  ship:
    label: ⓢ交付
    command: ship
    skill: ship
    role: session
    on_demand: true # 不在任何 track 内；用户明确要求提交/开 PR 时才进入（R19）
    entry: [任务已完成（completion.done_when 全部满足）, 用户明确要求提交 / 开 PR / 发布]
    exit: [用户要求的交付物完成（commit / PR / 发布），CI 绿]

# 每条轨道都含 verify → 每类任务都经过独立审查门（completion.required_on_tracks）。
tracks:
  simple: [triage, execute, verify]
  bug: [triage, debug, execute, verify]
  non_simple: [triage, discuss, spec, execute, verify, learn]
  research: [triage, research, verify]

# ── 2. 完成定义（硬要求）────────────────────────────────────────────
# 没有独立审查 PASS ⇒ 任务未完成。自检 / 实现者自签 / 验证命令全绿都不能替代。
completion:
  independent_review_required: true
  required_on_tracks: [simple, bug, non_simple, research] # 无「简单 / 只读 / 文档」豁免
  done_when:
    - verify_tier 清单全部附观察到的命令输出
    - 本轮全新独立审查者（非实现者、未 resume）给出 PASS，七维齐全，且 review.pass_requires 两道门（符合预期要求 + 原功能保持）均附证据通过
  # 轮次用尽仍未 PASS ⇒ 状态 BLOCKED（未完成），不是 DONE / DONE_WITH_CONCERNS，也不是「跳过审查」。
  on_rounds_exhausted: BLOCKED
  # 唯一豁免：用户本轮显式说出 quality_gates.json verification_gate.skip_keywords 之一；此时状态同样不是 DONE。
  user_waiver_status: DONE_WITH_CONCERNS
  # 站立默认目标（/goal）：与 review.pass_requires 同一两道门，不是第三道，也不另建 Stop hook。
  standing_goal:
    command: goal
    lines:
      - 所有修改符合预期要求
      - 且原功能保持不变
    bars: [requirements_met, original_functionality_preserved]

# ── 3. 一次通过质量契约 ───────────────────────────────────────────
quality:
  definition_of_ready:
    - 验收标准：每条一行、可验证、用户已确认
    - 影响清单完整：change-impact 阶段 1 输出（含文档/INDEX/版本戳/派生块）
    - 验证命令预先选定（构建/测试/lint/validate），写进计划
    - 审查者集合按 review.routing 预先选定
  self_check:
    - 用审查同一份七维逐条自检，任何一维答不上来就不交审
    - Grep 残留引用 = 0（改名/删除/移动）
    - 派生块已重新 render（改过 config/workflow.yaml 时）
  verify_tiers:
    proportional: 初判简单且 attempt=1：代码级 + 功能级 + 关联文件；贴命令证据
    full: 非简单或持续处理：比例全部 + 交叉验证全项 + 残留引用
  attempt_escalation: 2 # attempt ≥ 此值 → 执行升档非简单 + verify_tier=full

# ── 4. 独立审查 ───────────────────────────────────────────────────
# render 同步到 config/quality_gates.json verification_gate（hooks 消费）与审查者 agent 契约块。
review:
  # 名称须与 hooks/_lib/r20_replay.py 机械门一致（V21 校验）
  dimensions:
    - { name: 满足, hint: 承认/反驳/弃权 + 证据 }
    - { name: 遗漏, hint: 原始要求逐条对照 }
    - { name: 错改, hint: 改了不该改的 }
    - { name: 漏改, hint: 含文档/注释/版本戳/派生块，或「无文档影响」 }
    - { name: 原功能, hint: 相对起点 tip 保持 + 测试/validate/冒烟观察输出；有意行为变更逐条列出 }
    - { name: 影响范围, hint: CRG get_impact_radius / IMPACT / blast-radius }
    - { name: 问题是否解决, hint: 已解决 | 未解决 | 部分解决 + 观察证据，禁止「看起来好了」 }
  # PASS 的定义：两道门同时满足，缺一即 NEEDS-CHANGES。审查者须对每道门给出证据。
  pass_requires:
    requirements_met:
      label: 符合预期要求
      check: 每项改动都对应原始要求 / 验收标准；逐条无遗漏；无破坏要求的范围外改动（满足 + 遗漏 + 错改 维）
      evidence: 原始要求逐条 → 对应改动或明确的反驳/弃权理由
    original_functionality_preserved:
      label: 原功能保持
      check: 起点 tip 上既有的预期行为全部保持，无静默回归；有意的行为变更逐条显式列出并对应原始要求（原功能 维）
      evidence: 相关测试 / validate / check 脚本的观察输出 + 相对起点 tip 的行为差异说明
  verdicts: [PASS, NEEDS-CHANGES]
  # 一轮 = 改 → 验 → 刷图 → 并行全新审查（一次找齐）。目标是第 1 轮 PASS；上限是保险丝，不是预算。
  max_rounds: 3
  max_blocks: 3 # Claude Stop 门最多阻断次数（防死循环；≥ max_rounds）；放行时状态按 completion.on_rounds_exhausted
  min_files: 1 # Stop 机械门的触发阈值（有交付编辑即强制）；无编辑任务由流程规则强制审查交付物
  refresh_graph_before_review: true # hooks 与 V16 要求恒为 true
  routing:
    always: [eng-reviewer]
    product: [ceo-reviewer]
    ui: [designer, dx-reviewer]
    api_dx: [dx-reviewer]
    tests: [qa]
    security: [security-reviewer]
    cross_model: [cross-model-reviewer] # 由调用方挑一个与实现者不同的模型；本包不指定是哪个
