# Harness 能力图 SSOT — v11.4.20
# capability id → 当前端实际 provider。缺能力必须 fallback 或 interrupt，禁止假装已调用。
# MCP 常驻服务器清单仍以 .mcp.json 为 Claude Code 权威；本文件只声明 capability→provider 解析。
# 各端 plugin/MCP 开关自管；sync.ps1 不改 mcp.json。
version: "11.4.20"
updated: "2026-09-03"

capability_ids:
  - code_explore
  - impact_review
  - symbol_edit
  - lib_docs
  - web_search
  - web_scrape
  - browser_ui
  - browser_e2e
  - browser_debug
  - memory
  - github
  - db
  - grep_remote

# 共享默认（Claude Code / 有 MCP 的编辑器）
defaults:
  code_explore:
    provider: mcp
    name: codegraph
    pin: "1.6.0"
    fallback: grep_after_graphs
  impact_review:
    provider: mcp
    name: code-review-graph
    pin: "2.3.8"
    fallback: code_explore
  symbol_edit:
    provider: mcp
    name: serena
    fallback: builtin_edit_grep
  lib_docs:
    provider: plugin
    name: context7
    fallback: web_search
  web_search:
    provider: plugin
    name: exa
    fallback: builtin_web_search
  web_scrape:
    provider: plugin
    name: firecrawl
    fallback: web_search
  browser_ui:
    provider: plugin
    name: playwright
    fallback: interrupt
  browser_e2e:
    provider: plugin
    name: playwright
    fallback: interrupt
  browser_debug:
    provider: interrupt
    name: chrome-devtools
    interrupt: true
    note: 默认关；中断请用户手动开 Plugin，禁止自动 merge debug.json
  memory:
    provider: plugin
    name: claude-mem
    pin: "13.13.1"
    fallback: none
  github:
    provider: cli
    name: gh
    fallback: interrupt
  db:
    provider: interrupt
    name: postgres
    interrupt: true
    note: 默认关；中断请用户设 DATABASE_URL 后启用
  grep_remote:
    provider: mcp
    name: grep
    fallback: none
    note: 仅跨公开仓；本地代码禁止用 grep MCP 替代 codegraph

harnesses:
  claude-code:
    inherits: defaults
  cursor:
    inherits: defaults
    overrides:
      browser_ui:
        provider: builtin
        name: cursor-ide-browser
        fallback: interrupt
      web_scrape:
        provider: none
        fallback: web_search
        note: Cursor 无常驻 firecrawl User MCP；L3 降级 Exa+Context7
      github:
        provider: cli
        name: gh
        fallback: interrupt
        note: github Plugin Disabled
  qoder-cn: &pluginless
    inherits: defaults
    overrides:
      lib_docs: { provider: mcp, name: context7, fallback: web_search, note: 无 marketplace plugin，钉版本 MCP }
      web_search: { provider: mcp, name: exa-mcp-server, fallback: builtin_web_search }
      web_scrape: { provider: mcp, name: firecrawl-mcp, fallback: web_search }
      browser_ui: { provider: mcp, name: playwright, fallback: interrupt }
      browser_e2e: { provider: mcp, name: playwright, fallback: interrupt }
      browser_debug: { provider: none, interrupt: true, note: 条目保留默认 disabled }
      memory: { provider: none, fallback: none, note: 无 claude-mem 则声明缺口，禁止假装已搜 }
  trae-cn:
    <<: *pluginless
  qoder:
    <<: *pluginless
  trae:
    <<: *pluginless
  codearts:
    <<: *pluginless
  workbuddy:
    inherits: defaults
    extra:
      note: 仅 CLAUDE.md+skills 联接；无独立 MCP 通道则跟随 Claude Code 真源
  dsh:
    <<: *pluginless
    extra:
      agents_md: self-managed
      portable:
        - graph_freshness_cli.py
        - r20_check.py
      home: "~/.dsh"
      version_map: "DSH 2.12 ↔ claude 11.4.20"
      forbid: claude_md_overwrite_agents_md
  opencode:
    <<: *pluginless
    extra:
      agents_md: self-managed
      portable:
        - graph_freshness_cli.py
        - r20_check.py
        - graph-freshness.ts
        - verify-gate.ts
      home: "~/.config/opencode"
      version_map: "OpenCode 1.12 ↔ claude 11.4.20"
      forbid: claude_md_overwrite_agents_md
